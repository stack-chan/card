:root { color-scheme:light; --ink:#252525; --muted:#737373; --line:#e5e5e5; --canvas:#f3f4f5; --radius:4px; font-family:Inter,"Noto Sans CJK JP","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:#fff; font-size:13px; letter-spacing:0; font-synthesis:none; }
*,*::before,*::after { box-sizing:border-box; }
body { margin:0; }
button,input,textarea,select { font:inherit; letter-spacing:0; }
button,label { -webkit-tap-highlight-color:transparent; }
button { cursor:pointer; }
button:disabled { opacity:.4; cursor:not-allowed; }
button svg { flex-shrink:0; }
fieldset { border:0; margin:0; padding:0; min-width:0; }
h1,h2,p { margin:0; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
:focus-visible { outline:2px solid #434343; outline-offset:3px; }
.app-shell { min-height:100svh; }
.app-header { height:56px; border-bottom:1px solid var(--line); background:white; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 24px; position:relative; z-index:5; }
.brand { display:flex; align-items:center; gap:14px; font-size:14px; font-weight:600; line-height:1; white-space:nowrap; }
.brand span { font-size:12px; font-weight:400; color:var(--muted); padding-left:14px; border-left:1px solid #d9d9d9; }
.ui-button { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:36px; min-width:36px; padding:0 12px; font-size:12px; font-weight:500; border:1px solid transparent; border-radius:var(--radius); background:var(--ink); color:white; white-space:nowrap; transition:background .12s; }
.ui-button:hover:not(:disabled) { background:#404040; }
.ui-button[data-variant=ghost] { background:transparent; color:var(--ink); }
.ui-button[data-variant=ghost]:hover:not(:disabled) { background:#f2f2f2; }
.ui-button[data-variant=outline] { background:#fff; color:var(--ink); border-color:#ddd; }
.ui-button[data-size=icon] { padding:0; width:36px; }
.export-button { width:110px; }
.workspace { display:grid; grid-template-columns:288px minmax(0,1fr); height:calc(100svh - 56px); min-height:0; }
.editor-sidebar { padding:24px; background:white; border-right:1px solid var(--line); overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; }
.fields-panel { display:flex; flex-direction:column; gap:16px; }
.form-field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.ui-label { display:block; font-size:12px; font-weight:500; line-height:18px; }
.ui-input,.ui-textarea { display:block; background:white; border:1px solid #dcdcdc; color:var(--ink); border-radius:var(--radius); width:100%; min-width:0; font-size:13px; font-weight:400; line-height:20px; padding:7px 9px; outline:none; }
.ui-input { height:36px; }
.ui-textarea { resize:vertical; min-height:54px; max-height:160px; }
.ui-textarea.role-input { height:36px; min-height:36px; }
.ui-input:hover,.ui-textarea:hover { border-color:#bfbfbf; }
.ui-input:focus,.ui-textarea:focus { border-color:#555; box-shadow:0 0 0 1px #555; }
.ui-input[aria-invalid=true],.ui-textarea[aria-invalid=true] { border-color:#b83e34; }
.field-error,.export-error { color:#b0352c; font-size:12px; line-height:1.6; }
.background-section { margin-top:24px; padding-top:14px; border-top:1px solid var(--line); }
.section-heading { height:36px; display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.section-heading h2 { font-size:12px; font-weight:500; }
.section-heading .ui-button { color:#666; margin-right:-8px; }
.section-heading .tooltip { left:auto; right:0; transform:none; }
.background-picker { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.background-choice { position:relative; display:block; aspect-ratio:91/55; border:1px solid var(--line); border-radius:4px; cursor:pointer; background:white; }
.background-choice:hover { border-color:#999; }
.background-choice.selected { outline:1px solid var(--ink); border-color:var(--ink); }
.background-choice:focus-within { outline:2px solid #555; outline-offset:3px; }
.background-choice>input,.segment>input,.color-choice>input { position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; clip:auto; opacity:0; z-index:1; cursor:pointer; }
.background-thumb { width:100%; height:100%; display:block; border-radius:3px; }
.preview-region { display:flex; align-items:center; justify-content:center; padding:44px; min-width:0; min-height:0; background:var(--canvas); }
.paper-wrap { width:100%; max-width:min(1000px,calc((100svh - 172px) * var(--paper-ratio))); }
.preview-card { width:100%; aspect-ratio:91/55; background:white; box-shadow:0 2px 4px #00000009,0 12px 32px #0000000a; }
.preview-card.with-bleed { aspect-ratio:97/61; }
.preview-card>svg { display:block; width:100%; height:100%; overflow:hidden; }
.paper-caption { display:flex; justify-content:space-between; gap:12px; font-size:11px; line-height:18px; color:#777; padding-top:12px; min-height:30px; font-variant-numeric:tabular-nums; }
.paper-caption>span:last-child { flex-shrink:0; }
.popover-anchor { display:inline-flex; }
.ui-popover { position:fixed; inset:auto; margin:0; padding:16px; width:254px; border:1px solid #ddd; border-radius:6px; background:white; color:var(--ink); box-shadow:0 8px 32px #00000018,0 1px 4px #00000008; overflow:auto; font-size:12px; }
.ui-popover:not(:popover-open) { display:none; }
.ui-popover:focus { outline:none; }
.ui-popover::backdrop { background:transparent; }
.popover-divider { height:1px; margin:14px 0; background:var(--line); }
.export-options { display:flex; flex-direction:column; gap:2px; margin:-6px; }
.export-options>.ui-button { width:100%; justify-content:flex-start; }
.option-meta { margin-left:auto; color:var(--muted); font-size:11px; }
.check-label { display:flex; align-items:center; gap:9px; min-height:28px; cursor:pointer; line-height:20px; }
.check-label input { width:15px; height:15px; margin:0; accent-color:var(--ink); flex-shrink:0; }
.export-error { margin-top:8px; }
.design-panel { display:flex; flex-direction:column; gap:18px; }
.design-panel legend { font-size:12px; font-weight:500; margin-bottom:8px; }
.segmented-control { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); padding:3px; gap:3px; border-radius:5px; background:#f0f0f0; }
.segment { position:relative; display:flex; align-items:center; justify-content:center; height:32px; border-radius:3px; color:#777; cursor:pointer; }
.segment.selected { color:#242424; background:white; box-shadow:0 1px 3px #00000012; }
.segment:focus-within { outline:2px solid #555; outline-offset:2px; }
.color-options { display:flex; justify-content:space-between; gap:8px; }
.color-choice { position:relative; cursor:pointer; width:32px; height:32px; display:grid; place-items:center; border-radius:50%; }
.swatch { width:24px; height:24px; border-radius:50%; background:var(--swatch); display:grid; place-items:center; color:white; }
.color-choice.selected { outline:1px solid #aaa; }
.color-choice:focus-within { outline:2px solid #555; outline-offset:2px; }
.opacity-field label { display:flex; justify-content:space-between; font-size:12px; font-weight:500; margin-bottom:8px; }
.opacity-field output { font-size:11px; color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums; }
.opacity-field input { display:block; width:100%; height:20px; margin:0; accent-color:var(--ink); }
.opacity-field input:disabled { opacity:.4; }
.reset-button.ui-button { padding:0 2px; min-height:28px; height:auto; color:#777; font-size:12px; }
.has-tooltip { position:relative; }
.tooltip { position:absolute; bottom:calc(100% + 7px); left:50%; transform:translateX(-50%); padding:5px 7px; background:#282828; color:white; border-radius:4px; font-size:11px; font-weight:400; line-height:16px; white-space:nowrap; pointer-events:none; visibility:hidden; opacity:0; z-index:9; transition:opacity .1s; }
.has-tooltip:focus-visible>.tooltip,.has-tooltip:has(input:focus-visible)>.tooltip { visibility:visible; opacity:1; }
@media(hover:hover) { .has-tooltip:hover>.tooltip { visibility:visible; opacity:1; transition-delay:.25s; } }
.toast { position:fixed; z-index:20; bottom:24px; left:50%; transform:translateX(-50%); max-width:calc(100% - 32px); display:flex; align-items:center; gap:20px; padding:12px 14px; border:1px solid #dedede; background:white; box-shadow:0 4px 16px #0001; border-radius:6px; font-size:12px; }
.toast button { background:transparent; border:0; width:28px; height:28px; font-size:20px; color:#555; flex-shrink:0; }
@media(max-width:1050px) { .workspace { grid-template-columns:272px minmax(0,1fr); } .editor-sidebar { padding:22px 20px; } .preview-region { padding:32px; } }
@media(max-width:760px) {
  .app-header { height:54px; padding:0 16px; }
  .ui-button { min-height:38px; }
  .workspace { display:flex; flex-direction:column; height:auto; }
  .preview-region { order:-1; padding:24px 20px 16px; }
  .paper-wrap { max-width:540px; }
  .paper-caption { padding-top:10px; }
  .editor-sidebar { width:100%; max-width:580px; align-self:center; overflow:visible; border:0; padding:24px 24px 40px; }
  .fields-panel { gap:18px; }
  .ui-input,.ui-textarea { font-size:16px; }
  .ui-input { height:40px; }
  .ui-textarea.role-input { height:40px; min-height:40px; }
  .ui-textarea { min-height:60px; }
  .background-picker { grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .background-section { margin-top:28px; }
  .ui-popover { padding:18px; width:264px; }
  .segment { height:38px; }
  .color-choice { width:36px; height:36px; }
}
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
@media print {
  @page { size:91mm 55mm; margin:0; }
  html,body,.app-shell,.workspace { width:91mm; height:55mm; min-height:0; display:block; margin:0; padding:0; background:white; }
  .app-header,.editor-sidebar,.paper-caption,.toast,.ui-popover { display:none!important; }
  .preview-region,.paper-wrap,.preview-card { display:block; width:91mm; height:55mm; max-width:none; margin:0; padding:0; box-shadow:none; }
  .preview-card>svg { width:100%; height:100%; }
  [data-guide] { display:none; }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
